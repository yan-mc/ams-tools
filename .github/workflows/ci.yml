name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Syntax check
        run: python -m py_compile msvc2pth/msvc2pth.py msvc2pth/verify_rvc.py
      - name: CLI help
        run: python msvc2pth/msvc2pth.py --help
